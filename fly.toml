# ORAC-IOS Backend on Fly.io
app = "orac-operations-api"
primary_region = "jnb"

[build]

[env]
  NODE_ENV = "production"
  STORE_DRIVER = "postgres"
  JWT_EXPIRES_IN = "8h"
  PORT = "8080"
  # CORS_ORIGINS, DATABASE_URL, and JWT_SECRET are Fly secrets. Never commit
  # their values to this file.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[checks]
  [checks.health]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    port = 8080
    timeout = "5s"
    type = "http"
